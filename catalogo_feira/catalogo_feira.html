<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo da Feira do Campus</title>
  <script src="catalogo_feira.js" defer></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color-scheme: dark;
      background: #0d1117;
      color: #e6edf3;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      width: min(94%, 76rem);
      margin: 2rem auto;
    }

    .cabecalho {
      padding: clamp(1.25rem, 4vw, 2.5rem);
      border: 1px solid #354e68;
      border-radius: 1rem;
      background: #142338;
    }

    .disciplina {
      color: #a9d2ff;
      font: 0.9rem/1.4 ui-monospace, monospace;
      margin-bottom: 0.6rem;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.1; }
    h2 { font-size: 1.25rem; line-height: 1.25; }
    .subtitulo { margin-top: 0.75rem; color: #b9c7d9; }

    .layout {
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
      align-items: start;
      gap: 1rem;
      margin-top: 1rem;
    }

    .painel {
      min-width: 0;
      padding: 1.2rem;
      border: 2px solid #30363d;
      border-radius: 0.8rem;
      background: #161b22;
    }

    #alternar-editor { margin-bottom: 0.75rem; }
    .instrucao { color: #b9c7d9; margin-top: 0.4rem; }
    .campo { margin-top: 0.9rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 650; }

    input {
      width: 100%;
      min-height: 2.7rem;
      padding: 0.55rem 0.7rem;
      border: 2px solid #596a7e;
      border-radius: 0.4rem;
      background: #0d1117;
      color: #e6edf3;
      font: inherit;
    }

    input::placeholder { color: #9aabbf; }
    .erro { display: block; color: #ffaaa4; margin-top: 0.25rem; }
    .erro:empty { margin-top: 0; }

    button {
      min-height: 2.5rem;
      padding: 0.5rem 0.8rem;
      border: 1px solid #8ec6ff;
      border-radius: 0.4rem;
      background: #8ec6ff;
      color: #0d1725;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #bddfff; }
    .secundario, td button {
      border-color: #596a7e;
      background: #1c2a3a;
      color: #e6edf3;
    }
    .secundario:hover, td button:hover { background: #2a415b; }
    :focus-visible { outline: 3px solid #f2ca72; outline-offset: 3px; }
    #salvar { margin-top: 1rem; }
    #retorno { min-height: 1.5em; margin-top: 0.7rem; color: #c8dcf5; }

    #contagem {
      margin-top: 0.45rem;
      color: #b9c7d9;
    }

    .tabela-rolagem {
      overflow-x: auto;
      margin-top: 0.85rem;
      border: 1px solid #30363d;
      border-radius: 0.5rem;
    }

    table {
      width: 100%;
      min-width: 35rem;
      border-collapse: collapse;
      text-align: left;
    }

    th, td { padding: 0.65rem; vertical-align: middle; }
    th { background: #212c3a; color: #cde2ff; white-space: nowrap; }
    td { border-top: 1px solid #30363d; }
    td:nth-child(2) { overflow-wrap: anywhere; }
    td:nth-child(3), td:nth-child(4), td:nth-child(5) { white-space: nowrap; }
    td:last-child { white-space: nowrap; }
    td button { padding: 0.35rem 0.55rem; font-size: 0.875rem; }
    td button + button { margin-left: 0.35rem; }

    .oculto { display: none; }
    .campo-invalido { border-color: #ff7b72; }
    .modo-edicao { border-color: #bc8cff; }

    @media (max-width: 56rem) {
      main { margin: 1rem auto; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header class="cabecalho">
      <p class="disciplina">Front-End II · Atividade prática</p>
      <h1>Catálogo da Feira do Campus</h1>
      <p class="subtitulo">Cadastre os produtos da feira e confira o preço com desconto.</p>
    </header>

    <div class="layout">
      <div>
        <button id="alternar-editor" type="button" class="secundario" aria-controls="editor">
          Ocultar formulário
        </button>

        <section id="editor" class="painel" aria-labelledby="titulo-editor">
          <h2 id="titulo-editor">Dados do produto</h2>
          <p class="instrucao">Preencha os três campos para cadastrar um item.</p>

          <form id="form-produto" novalidate>
            <div class="campo">
              <label for="nome">Nome do produto</label>
              <input id="nome" name="nome" type="text" required minlength="2"
                     placeholder="Ex.: Camiseta" aria-describedby="erro-nome">
              <small id="erro-nome" class="erro"></small>
            </div>

            <div class="campo">
              <label for="preco">Preço (R$)</label>
              <input id="preco" name="preco" type="number" required min="0" step="0.01"
                     placeholder="Ex.: 80" aria-describedby="erro-preco">
              <small id="erro-preco" class="erro"></small>
            </div>

            <div class="campo">
              <label for="desconto">Desconto (%)</label>
              <input id="desconto" name="desconto" type="number" required min="0" max="100"
                     step="0.01" placeholder="Ex.: 25" aria-describedby="erro-desconto">
              <small id="erro-desconto" class="erro"></small>
            </div>

            <button id="salvar" type="submit">Cadastrar produto</button>
          </form>
        </section>

        <p id="retorno" role="status"></p>
      </div>

      <section class="painel" aria-labelledby="titulo-catalogo">
        <h2 id="titulo-catalogo">Produtos cadastrados</h2>
        <p id="contagem">Nenhum produto cadastrado.</p>

        <div class="tabela-rolagem" tabindex="0" role="region" aria-label="Tabela de produtos">
          <table>
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Produto</th>
                <th scope="col">Preço</th>
                <th scope="col">Desconto</th>
                <th scope="col">Final</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="linhas-produtos"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
